[project]
name = "autonomus-core"
version = "0.1.0"
description = "AUTONOMUS P-01 conditional core backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "aiosqlite==0.22.1",
  "greenlet==3.5.6",
  "psutil==7.2.2",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
